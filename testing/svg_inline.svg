/* Batik does not support local() font sources; browsers opt in via @supports. */
@supports (font-kerning: auto) {
    @font-face {
        font-family: "DejaVu Sans Mono";
        src: local("DejaVu Sans Mono"), local("DejaVuSansMono"), local("DejaVu Sans Mono Book");
        font-weight: 400;
        font-style: normal;
    }
    @font-face {
        font-family: "DejaVu Sans";
        src: local("DejaVu Sans"), local("DejaVuSans"), local("DejaVu Sans Book");
        font-weight: 400;
        font-style: normal;
    }
}
/* Embedded in each export so files and image elements need no host CSS. */
.bridge-svg .bridge-svg-holding { fill: #111; }
.bridge-svg .bridge-svg-h, .bridge-svg .bridge-svg-d { fill: #c00; }
.bridge-svg .bridge-svg-s, .bridge-svg .bridge-svg-c { fill: #111; }
.bridge-svg .bridge-svg-table { fill: #eee; stroke: #333; stroke-width: 1; }
.bridge-svg .bridge-svg-label { font-size: 12px; letter-spacing: 0; word-spacing: 0; font-weight: bold; text-anchor: middle; fill: #111; }
.bridge-svg-mono .bridge-svg-suit { fill: #111; }
</style>
