<svg xmlns="http://www.w3.org/2000/svg" version="1.1" class="bridge-svg" width="282" height="96" viewBox="0 0 282 96" role="img">
<title>A long bridge hand</title>
<style type="text/css">/* Embedded in each export so files and image elements need no host CSS. */
.bridge-svg .bridge-svg-holding { font-family: monospace; font-size: 14px; fill: #111; }
.bridge-svg .bridge-svg-suit { font-family: "DejaVu Sans", sans-serif; }
.bridge-svg .bridge-svg-h, .bridge-svg .bridge-svg-d { fill: #c00; }
.bridge-svg .bridge-svg-s, .bridge-svg .bridge-svg-c { fill: #111; }
.bridge-svg .bridge-svg-table { fill: #eee; stroke: #333; stroke-width: 1; }
.bridge-svg .bridge-svg-label { font-family: sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #111; }
.bridge-svg-mono .bridge-svg-suit { fill: #111; }
</style>
<g class="bridge-svg-hand bridge-svg-n">
<text class="bridge-svg-holding" x="12" y="24"><tspan class="bridge-svg-suit bridge-svg-s">♠</tspan><tspan x="36">A K Q J 10 9 8 7 6 5 4 3 2</tspan></text>
<text class="bridge-svg-holding" x="12" y="44"><tspan class="bridge-svg-suit bridge-svg-h">♥</tspan><tspan x="36">-</tspan></text>
<text class="bridge-svg-holding" x="12" y="64"><tspan class="bridge-svg-suit bridge-svg-d">♦</tspan><tspan x="36">-</tspan></text>
<text class="bridge-svg-holding" x="12" y="84"><tspan class="bridge-svg-suit bridge-svg-c">♣</tspan><tspan x="36">-</tspan></text>
</g>
</svg>