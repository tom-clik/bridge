<svg xmlns="http://www.w3.org/2000/svg" version="1.1" class="bridge-svg" font-size="14" letter-spacing="0" word-spacing="0" width="282" height="102.2" viewBox="0 0 282 102.2" role="img">
<title>A long bridge hand</title>
<style type="text/css">/* Embedded in each export so files and image elements need no host CSS. */
.bridge-svg .bridge-svg-holding { font-family: monospace; fill: #111; }
.bridge-svg .bridge-svg-suit { font-family: "DejaVu Sans", sans-serif; }
.bridge-svg .bridge-svg-h, .bridge-svg .bridge-svg-d { fill: #c00; }
.bridge-svg .bridge-svg-s, .bridge-svg .bridge-svg-c { fill: #111; }
.bridge-svg .bridge-svg-table { fill: #eee; stroke: #333; stroke-width: 1; }
.bridge-svg .bridge-svg-label { font-family: sans-serif; font-size: 12px; letter-spacing: 0; word-spacing: 0; font-weight: bold; text-anchor: middle; fill: #111; }
.bridge-svg-mono .bridge-svg-suit { fill: #111; }
</style>
<g class="bridge-svg-hand bridge-svg-n">
<text class="bridge-svg-holding" x="12" y="26"><tspan class="bridge-svg-suit bridge-svg-s">♠</tspan><tspan x="36">A K Q J 10 9 8 7 6 5 4 3 2</tspan></text>
<text class="bridge-svg-holding" x="12" y="46"><tspan class="bridge-svg-suit bridge-svg-h">♥</tspan><tspan x="36">-</tspan></text>
<text class="bridge-svg-holding" x="12" y="66"><tspan class="bridge-svg-suit bridge-svg-d">♦</tspan><tspan x="36">-</tspan></text>
<text class="bridge-svg-holding" x="12" y="86"><tspan class="bridge-svg-suit bridge-svg-c">♣</tspan><tspan x="36">-</tspan></text>
</g>
</svg>