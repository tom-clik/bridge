<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inline bridge SVG examples</title>
  <link rel="stylesheet" href="../assets/css/bridge_svg.css">
  <style>
    /* Font loading belongs to the page, not the SVG. */
    @font-face {
      font-family: "DejaVu Sans Mono";
      src: url("../assets/fonts/dejavu-sans-mono/DejaVuSansMono.ttf") format("truetype");
    }
    @font-face {
      font-family: "DejaVu Sans";
      src: url("../assets/fonts/dejavu-sans/DejaVuSans.ttf") format("truetype");
    }
    body { margin: 2rem auto; padding: 0 1rem; max-width: 50rem; font-family: sans-serif; }
    .bridge-svg { display: block; max-width: 100%; height: auto; margin: 1rem auto 2rem; }
  </style>
</head>
<body>
  <h1>Inline bridge diagrams</h1>
  <p>The page supplies shared styles and fonts. SVGs are inserted into the page, not displayed as image elements.</p>
  <h2>Live deal</h2>
  <div data-svg="svg_export.cfm">Loading deal…</div>
  <h2>Single hand</h2>
  <div data-svg="svg_inline.svg">Loading hand…</div>
  <h2>Saved deal</h2>
  <div data-svg="svg_test.svg">Loading saved deal…</div>
  <script>
    // On a server-rendered page, output parser.exportSvg() directly instead.
    document.querySelectorAll('[data-svg]').forEach(async placeholder => {
      try {
        const response = await fetch(placeholder.dataset.svg);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const doc = new DOMParser().parseFromString(await response.text(), 'image/svg+xml');
        if (doc.querySelector('parsererror') || doc.documentElement.localName !== 'svg') {
          throw new Error('Invalid SVG');
        }
        placeholder.replaceWith(document.importNode(doc.documentElement, true));
      } catch (error) {
        placeholder.textContent = `Unable to load diagram: ${error.message}`;
      }
    });
  </script>
</body>
</html>
